apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-service-dev
  namespace: argocd
spec:
  project: project-catalogue
  source:
    repoURL: https://github.com/Fauler/project-catalogue-kubernetes.git
    targetRevision: main
    path: auth-service
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: catalogue-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
